# Vorlage für ein Projekt-Repo: nach .github/workflows/security.yml kopieren.
#
# Benötigte Secrets im Projekt-Repo (Settings > Secrets and variables > Actions):
#   NVD_API_KEY   dringend empfohlen, sonst dauert das NVD-Update sehr lange
#   SONAR_TOKEN   Global Analysis Token von sonar.backsafe.de, ohne Token wird der Sonar-Job übersprungen

name: Security

on:
  push:
    # Beide Namen, damit es ohne Anpassung in main- und master-Repos läuft
    branches: [main, master]
  pull_request:
  schedule:
    # Wöchentlich, damit neue CVEs auch ohne Commit auffallen
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    uses: kvnflx/github/.github/workflows/dependency-check.yml@v1
    with:
      fail-on-cvss: 7
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  sonarqube:
    uses: kvnflx/github/.github/workflows/sonarqube.yml@v1
    # Standard: eigener Server https://sonar.backsafe.de, Quality Gate nur berichtend.
    # Scharfschalten mit:
    # with:
    #   quality-gate: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
