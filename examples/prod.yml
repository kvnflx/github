# Produktions-Pipeline für Repos auf backsafe-prod-server.
# Live geht nur, was Build, OWASP Dependency-Check und SonarQube bestanden hat.
# Nach dem Deploy Smoke-Test, bei Fehler automatischer Rollback.
#
# Repo-Variablen: COOLIFY_APP_UUID, PROD_URL, PROD_NAME, PROD_KEYWORD
# Secrets (Actions): SONAR_TOKEN, COOLIFY_DEPLOY_TOKEN, NTFY_URL
# Secrets (Dependabot): SONAR_TOKEN, NTFY_URL, AUTOMERGE_CLIENT_ID, AUTOMERGE_APP_KEY

name: Prod

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Montags ohne Deploy, damit neue Lücken in live laufendem Code auffallen
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: kvnflx/github/.github/workflows/docker-build.yml@v1

  dependency-check:
    uses: kvnflx/github/.github/workflows/dependency-check.yml@v1
    with:
      fail-on-cvss: 7

  sonarqube:
    uses: kvnflx/github/.github/workflows/sonarqube.yml@v1
    with:
      quality-gate: true
      require-token: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: [build, dependency-check, sonarqube]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: kvnflx/github/.github/workflows/deploy-coolify.yml@v1
    with:
      app-uuid: ${{ vars.COOLIFY_APP_UUID }}
      url: ${{ vars.PROD_URL }}
      keyword: ${{ vars.PROD_KEYWORD }}
      name: ${{ vars.PROD_NAME }}
    secrets:
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      NTFY_URL: ${{ secrets.NTFY_URL }}

  notify-blocked:
    needs: [build, dependency-check, sonarqube]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: kvnflx/github/.github/workflows/notify-ntfy.yml@v1
    with:
      title: ${{ github.event_name == 'schedule' && format('Neue Lücke in Produktion{0} {1}', ':', vars.PROD_NAME) || format('Deploy blockiert{0} {1}', ':', vars.PROD_NAME) }}
      message: "Checks auf main sind rot: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      NTFY_URL: ${{ secrets.NTFY_URL }}
