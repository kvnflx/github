# Auto-Merge für Dependabot: Patch und Minor werden gemergt, sobald alle Pflicht-Checks grün sind.
# Major bleibt als PR stehen und wird per ntfy gemeldet. Ohne Pflicht-Checks auf main (vor GitHub
# Pro bei privaten Repos) passiert nichts, damit nie ungeprüft gemergt wird.
# Der Merge läuft über die GitHub App backsafe-automerge. Ein Merge mit dem eingebauten
# GITHUB_TOKEN würde keinen neuen Workflow auslösen, also auch keinen Deploy.

name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      tooling-ref:
        type: string
        default: v1
    secrets:
      AUTOMERGE_CLIENT_ID:
        required: true
      AUTOMERGE_APP_KEY:
        required: true
      NTFY_URL:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    name: Auto-Merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Update-Art lesen
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Ohne Pflicht-Checks auf dem Default-Branch würde --auto sofort mergen, ohne auf die Checks
      # zu warten. Dann lieber nichts tun und den PR offen lassen.
      - name: Pflicht-Checks auf main prüfen
        id: rules
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          n=$(gh api "repos/$REPO/rules/branches/$BRANCH" --jq '[.[] | select(.type == "required_status_checks")] | length' 2>/dev/null || echo 0)
          if [ "$n" -gt 0 ]; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Kein Auto-Merge::Auf $BRANCH sind keine Pflicht-Checks aktiv. Auto-Merge würde ohne Checks mergen, der PR bleibt offen."
            echo "protected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: App-Token holen
        id: token
        if: steps.rules.outputs.protected == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_KEY }}

      - name: Auto-Merge einschalten
        if: steps.rules.outputs.protected == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Werkzeug laden
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kvnflx/github
          ref: ${{ inputs.tooling-ref }}
          path: .tooling
          persist-credentials: false

      - name: Major-Update melden
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          REPO: ${{ github.repository }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          python3 .tooling/scripts/coolify_deploy.py notify --priority 3
          --title "Major-Update wartet: $REPO"
          --message "$DEPS braucht eine Prüfung von Hand: $PR_URL"
