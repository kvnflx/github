# Meldung per ntfy, z. B. wenn Checks auf main rot sind.

name: ntfy-Meldung

on:
  workflow_call:
    inputs:
      title:
        type: string
        required: true
      message:
        type: string
        required: true
      priority:
        description: 1 (leise) bis 5 (dringend).
        type: number
        default: 4
      tooling-ref:
        type: string
        default: v1
    secrets:
      NTFY_URL:
        required: false

permissions:
  contents: read

jobs:
  notify:
    name: Meldung
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Werkzeug laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kvnflx/github
          ref: ${{ inputs.tooling-ref }}
          path: .tooling
          persist-credentials: false
      - name: Senden
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
          PRIORITY: ${{ inputs.priority }}
        run: python3 .tooling/scripts/coolify_deploy.py notify --title "$TITLE" --message "$MESSAGE" --priority "$PRIORITY"
